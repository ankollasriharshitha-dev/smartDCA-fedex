<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCA Dashboard</title>
  <style>

      text-align: center;
      padding: 30px;
    }
    table{
      border-collapse: collapse;
      width: 100%;
      height:250px;
    }
    th, td{
      border: 1px solid black;
      padding: 10px;
      text-align: center;

    }
    th{
      background-color: rgb(12, 69, 69);
      color: white;
    }
  </style>
</head>
<body>

    <tr>
      <th>Case ID</th>
      <th>Amount</th>

      <th>AI Priority</th>
    </tr>
    <tr>
      <td>101</td>
      <td>15000</td>

      <td>High</td>
    </tr>
    <tr>
      <td>102</td>
      <td>5000</td>
      <td>80</td>

    </tr>
    <tr>
      <td>103</td>

      <td>medium</td>
    </tr>
  </table>
</body>
</html>
