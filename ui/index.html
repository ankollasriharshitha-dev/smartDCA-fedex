<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart DCA</title>
    <style>
        body{
            padding-top: 100px;
            text-align: center;

        }
        a{
            text-decoration: none;
        }
        button{
            padding: 15px;
            width: 50%;
            color: white;
            background-color: rgb(145, 42, 171);
            border-radius: 9px;
        }
        input{
            width: 90%;
            padding: 10px;
            border-radius: 8px;
        }
        .login{
            padding: 15px;
            margin: auto;
            border: 2px solid rgb(44, 45, 71);
            width: 350px;
            height: 300px;
            box-shadow: 0 0 15px rgb(71, 5, 74) ;
            border-radius: 15px;
            transition: transform 2s box-shadow 4s;
        }
        .login:hover{
            transform: translateY(12px);
            box-shadow: 0 0 50px rgb(55, 3, 55) ;
        }
    </style>
</head>
<body>
    <div class="login">
    <h1>Smart DCA</h1>
    <P>Smart Dept Collection Agency Platform</P>
    
    <input type="text" name="name" id="name" placeholder="Username" required/>
    <br><br>
    
    <input type="password" name="pass" id="pass" placeholder="Password" required/>
    <br><br>
    <a href="dashboard.html">
    <button>LOGIN</button>
    </a>
    </div>
</body>
</html>
